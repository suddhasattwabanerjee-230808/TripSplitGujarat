name: iOS build (unsigned)

# Manual only, for now: this produces an unsigned .ipa meant to be re-signed
# and installed locally (see the free-Apple-ID sideload path), not published.
# A paid Developer Program account would let this mirror release.yml's
# tag-triggered flow with real code signing instead.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write the Google Maps iOS API key into Info.plist
        run: |
          test -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" || { echo "::error::GOOGLE_MAPS_API_KEY secret is missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :GMSApiKey ${{ secrets.GOOGLE_MAPS_API_KEY }}" ios/Runner/Info.plist

      - run: flutter pub get

      # firebase-ios-sdk 13 needs gtm-session-fetcher >= 4, but google_sign_in_ios
      # 6.3.x still caps GoogleSignIn-iOS below 10 (which pins gtm-session-fetcher
      # 3.x), so SwiftPM can't resolve. Widen the cap the same way upstream PR
      # flutter/packages#13306 does (version range + iOS 15 minimum, no code
      # changes). iOS CI only; drop this step once google_sign_in_ios ships 6.4.0.
      - name: Allow GoogleSignIn-iOS 10 in google_sign_in_ios
        run: |
          dir=$(python3 -c 'import json,urllib.parse as u;print(next(u.unquote(p["rootUri"][7:]) for p in json.load(open(".dart_tool/package_config.json"))["packages"] if p["name"]=="google_sign_in_ios"))')
          pkg="$dir/darwin/google_sign_in_ios/Package.swift"
          pod="$dir/darwin/google_sign_in_ios.podspec"
          grep -q 'from: "9.0.0")' "$pkg" || { echo "::error::google_sign_in_ios Package.swift changed; revisit this patch"; exit 1; }
          sed -i '' -e 's/from: "9.0.0")/"9.0.0"..<"11.0.0")/' -e 's/\.iOS("13.0")/.iOS("15.0")/' -e 's/\.macOS("10.15")/.macOS("12.0")/' "$pkg"
          sed -i '' -e "s/'GoogleSignIn', '~> 9.0'/'GoogleSignIn', '>= 9.0', '< 11.0'/" -e "s/ios.deployment_target = '13.0'/ios.deployment_target = '15.0'/" -e "s/osx.deployment_target = '10.15'/osx.deployment_target = '12.0'/" "$pod"
          grep -n 'GoogleSignIn-iOS' -A1 "$pkg"; grep -n "dependency 'GoogleSignIn'" "$pod"

      # --no-codesign: no Apple Developer Program account yet, so there's
      # nothing to sign with in CI. The free-tier sideload tool re-signs this
      # .app locally with a short-lived personal-team certificate instead.
      - run: flutter build ios --release --no-codesign --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Package the unsigned .app as an .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr TripSplit-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TripSplit-unsigned-ipa
          path: build/ios/iphoneos/TripSplit-unsigned.ipa
          retention-days: 14
