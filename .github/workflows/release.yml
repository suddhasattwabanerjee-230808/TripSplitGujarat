name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # A normal run is ~5-10 min; cap hangs well short of GitHub's 6h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write Google Maps API key for the build
        run: echo "googleMaps.apiKey=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/local.properties

      - name: Write the release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - run: flutter pub get
      # arm64-v8a only: every phone this app has ever been installed on is
      # 64-bit, and a universal build triples the OTA payload (bundles
      # armeabi-v7a and x86_64 libs nobody's device uses). This is the single
      # biggest lever on download time — ~53MB -> ~20MB.
      - run: flutter build apk --release --target-platform android-arm64 --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME} — see CHANGELOG.md." > release_notes.md
          fi

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "TripSplit-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'TripSplit ${{ github.ref_name }}'
          body_path: release_notes.md
          files: TripSplit-${{ github.ref_name }}.apk

      - name: Publish OTA update to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+)/\1/')
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION_CODE" "$VERSION_NAME" > latest.json <<'PY'
          import json, sys
          print(json.dumps({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2],
                            "notes": open("release_notes.md").read()}))
          PY
          cp "TripSplit-${GITHUB_REF_NAME}.apk" TripSplit.apk
          gh release create "$GITHUB_REF_NAME" TripSplit.apk latest.json \
            --repo suddhasattwabanerjee-230808/TripSplit-releases \
            --title "TripSplit ${GITHUB_REF_NAME}" --notes-file release_notes.md --latest
