name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write Google Maps API key for the build
        run: echo "googleMaps.apiKey=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/local.properties

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME} — see CHANGELOG.md." > release_notes.md
          fi

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "TripSplit-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'TripSplit ${{ github.ref_name }}'
          body_path: release_notes.md
          files: TripSplit-${{ github.ref_name }}.apk
