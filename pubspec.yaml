name: trip_split_gujarat
description: A simple three-person trip expense splitter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  http: ^1.2.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
