name: trip_split_gujarat
description: Multi-user, multi-trip expense splitter with Google sign-in and Google Maps location picking.
publish_to: 'none'
version: 1.7.6+29

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  http: ^1.2.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  google_maps_flutter: ^2.10.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  google_sign_in: ^7.1.0
  image_picker: ^1.2.4
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/splash_logo.png
    - assets/success_check.json
